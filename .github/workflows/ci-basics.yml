name: CI Basics

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
jobs:
  build:
    name: Basic CI Job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Show repository structure
        run: |
          pwd
          ls -la

sast:
  name: SAST - SonarQube Scan
  runs-on: ubuntu-latest
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v2
      with:
        projectBaseDir: app
        env:
          SONAR_TOKEN: ${{ sqp_781fb0a0b6f1bf06d61cded18af72b5768eb48b3  }}
          SONAR_HOST_URL: ${{ http://20.119.97.42:9000/ }}
    - name: SonarQube Quality Gate
      uses: SonarSource/sonarqube-quality-gate-action@v1
      with:
        scanMetadataReportFile: app/.scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


